<!doctype html>
<html lang="pt-BR">
<head>
<title>Calcule a sua cidade · Custo do Trânsito RMC</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Hanken+Grotesk:wght@400..700&family=Overpass+Mono:wght@600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/fnp.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Custo do Trânsito RMC">
<meta property="og:description" content="Para cada R$ 1 que o SUS pagou por internações de trânsito, a conta real foi de pelo menos R$ 27. Campinas e os 20 municípios da região.">
<meta property="og:image" content="assets/fnp.png">
<meta name="theme-color" content="#0d0f13">

</head>
<body data-page="sua-cidade">
<div id="nav"></div>
<main>
  <section class="hero" style="padding-top:64px"><div class="wrap">
        <h1 class="display" style="margin-top:18px;font-size:clamp(40px,6vw,80px);max-width:14ch">Calcule a conta da sua cidade.</h1>
    <p class="lede">Digite mortes e internações do SIM e do SIH. Veja custo, leitos e economia.</p>
  </div></section>

  <section class="sec-tight"><div class="wrap">
    <div class="calc calc-city">
      <div class="work no-print">
        <label class="fld"><span class="lab">Começar pelos dados de</span>
          <select id="pre"><option value="">Digitar do zero</option></select></label>
        <label class="fld"><span class="lab">Nome do município</span><input type="text" id="fNome" style="font:inherit;font-size:16px;color:var(--ink);background:var(--bg-2);border:1px solid transparent;border-radius:12px;padding:11px 14px;width:100%" autocomplete="off"></label>
        <div class="form-grid">
          <label class="fld"><span class="lab">População</span><input type="number" id="fPop" min="0" step="1000"><span class="hint">IBGE</span></label>
          <label class="fld"><span class="lab">Mortes no trânsito</span><input type="number" id="fObitos" min="0" step="1"><span class="hint">SIM, V01–V89</span></label>
          <label class="fld"><span class="lab">Internações pelo SUS</span><input type="number" id="fInt" min="0" step="1"><span class="hint">SIH, V01–V89</span></label>
          <label class="fld"><span class="lab">Valor pago pelas AIH (R$)</span><input type="number" id="fValor" min="0" step="1000"><span class="hint">Em branco: média da RMC</span></label>
          <label class="fld"><span class="lab">Dias de internação</span><input type="number" id="fDias" min="0" step="10"><span class="hint">Em branco: média da RMC</span></label>
        </div>
        <details class="adv"><summary>Avançado</summary><label class="fld"><span class="lab">Dias de UTI (opcional)</span><input type="number" id="fUti" min="0" step="10"><span class="hint">Do seu hospital. Não é público.</span></label><label class="fld"><span class="lab">Referência de custo hospitalar</span>
          <select id="fCen"><option value="conservador">Conservadora (IPEA/ANTP)</option><option value="medio">Média (IPEA/ANTP)</option></select>
          <span class="hint">Se tiver o custo apurado do hospital, ele vale mais.</span></label></details>
      </div>
      <div style="min-width:0;display:grid;gap:40px;grid-template-columns:minmax(0,1fr)" id="resultado">
        <div>
          <p class="eyebrow" id="rNome"></p>
          <p class="display" style="font-size:clamp(34px,4.6vw,60px);margin-top:12px;max-width:16ch" id="rHead"></p>
          <div style="margin-top:32px" id="rBar"></div>
          <div class="gap-legend">
            <div class="s"><span class="k"><i class="key" style="--c:var(--sus)"></i>Pago pelo SUS</span><span class="v n" id="rPago"></span></div>
            <div></div>
            <div class="r"><span class="k"><i class="key h"></i>Além da tabela</span><span class="v n" id="rGap"></span></div>
          </div>
          <div id="rSrc" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>
        </div>
        <div class="figs" id="rFigs"></div>
        <div>
                    <div id="prev"></div>
        </div>
        <div class="no-print"><button type="button" class="btn" id="printBtn">Imprimir resultado</button></div>
      </div>
    </div>
  </div></section>
</main>
<div id="footer"></div>
<script src="assets/data-real.js"></script>
<script src="assets/data.js"></script>
<script src="assets/model.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
const D=RMC, F=M.fmt, esc=UI.esc;
const alpha=[...D.municipios].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
const $=id=>document.getElementById(id);
$('pre').innerHTML+=alpha.map(c=>`<option value="${c.slug}">${esc(c.nome)}</option>`).join('');
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)&&v>0?v:0};
function fill(slug){
  const c=D.municipios.find(x=>x.slug===slug);
  const v=c?{nome:c.nome,pop:c.pop,ob:c.obitos,int:c.internacoes,val:Math.round(c.valorAih),dias:c.diasInternacao}:{nome:'',pop:'',ob:'',int:'',val:'',dias:''};
  $('fNome').value=v.nome;$('fPop').value=v.pop;$('fObitos').value=v.ob;$('fInt').value=v.int;$('fValor').value=v.val;$('fDias').value=v.dias;$('fUti').value='';
}
let upd=null; const sbar=UI.stickybar('resultado');
function terr(){
  M.setCenario($('fCen').value);
  const pop=num('fPop')||1;
  return M.territorio({nome:$('fNome').value.trim()||'Seu município',slug:'sua',pop,obitos:num('fObitos'),internacoes:num('fInt'),valorAih:num('fValor'),diasInternacao:num('fDias'),diasUti:num('fUti'),pib:0,pibTotal:0});
}
function render(){
  const t=terr();
  $('rNome').textContent=t.nome;
  if(!t.internacoes){ $('rHead').textContent='Informe as internações.'; $('rFigs').innerHTML=''; $('rBar').innerHTML=''; sbar(''); return; }
  $('rHead').innerHTML=`${F.money(t.pago)} pagos pelo SUS. Custo de ao menos ${F.money(t.real)}.`;
  $('rBar').innerHTML=UI.unitchart(t.pago,t.real);
  $('rPago').textContent=F.money(t.pago); $('rGap').textContent=F.money(t.gap);
  $('rSrc').innerHTML=(t.pagoInformado?'<span class="src ok">valor informado por você</span>':'<span class="src est">média da RMC aplicada ao valor pago</span>')+'<span class="src est">IPEA/ANTP, '+F.brl(t.custoInt)+' por internado, piso</span>';
  const c=M.contaCompleta(t,false);
  $('rFigs').innerHTML=`
    <div class="fig"><span class="v n">${F.lt(t.leitosAno)}</span><span class="k">${t.leitosAno<1.5?'leito ocupado':'leitos ocupados'} o ano todo</span></div>
    <div class="fig"><span class="v n">${F.x0(t.fator)}</span><span class="k">custo sobre o valor pago</span></div>
    <div class="fig"><span class="v n">${F.money(c.total)}</span><span class="k">custo para a sociedade, piso</span></div>`;
  sbar(`<span>SUS <b>${F.money(t.pago)}</b></span><span>estimado <b>${F.money(t.real)}</b></span><span><b>${F.lt(t.leitosAno)}</b> ${t.leitosAno<1.5?'leito':'leitos'}</span>`);
  if(upd) upd();
}
fill('campinas'); $('pre').value='campinas';
$('pre').addEventListener('change',()=>{fill($('pre').value);render()});
document.querySelectorAll('input,#fCen').forEach(el=>el.addEventListener('input',render));
$('fCen').addEventListener('change',render);
upd=UI.prevencao($('prev'),terr(),{nome:'a cidade',get:terr});
$('printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});
render();
})();
</script>
</body>
</html>
