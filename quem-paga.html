<!doctype html>
<html lang="pt-BR">
<head>
<title>Quem paga · Custo do Trânsito RMC</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Hanken+Grotesk:wght@400..700&family=Overpass+Mono:wght@600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/fnp.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Custo do Trânsito RMC">
<meta property="og:description" content="Para cada R$ 1 que o SUS pagou por internações de trânsito, a conta real foi de pelo menos R$ 27. Campinas e os 20 municípios da região.">
<meta property="og:image" content="https://arturfortunato1.github.io/custo-transito-rmc/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d0f13">
<script src="assets/motion.js" defer></script>

</head>
<body data-page="quem-paga">
<div id="nav"></div>
<main>
  <section class="hero"><div class="wrap">
        <h1 class="display" style="margin-top:18px;font-size:clamp(32px,6vw,56px);max-width:15ch">Primeiro a saúde. Depois o resto.</h1>
    <p class="lede">Fatores por vítima: IPEA/ANTP 2003. Mortes e internações: dados oficiais.</p>
    <div class="picker" style="margin-top:36px">
      <label class="sr" for="terr">Território</label>
      <select id="terr"></select>
      <label class="chk"><input type="checkbox" id="inss"> <span>Incluir o INSS</span></label>
    </div>
  </div></section>

  <section class="sec-tight"><div class="wrap">
    <div class="total-card">
      <div>
        <p class="eyebrow" id="sLabel">Saúde, estimada</p>
        <p class="v n" id="saude" style="font-family:var(--display);font-size:clamp(32px,5.4vw,56px);font-weight:800;letter-spacing:-.045em;line-height:1"></p>
        <p class="small" id="saudeSub" style="margin-top:10px;max-width:46ch"></p>
      </div>
      <div style="text-align:right">
        <p class="eyebrow" id="tLabel">Para a sociedade, piso</p>
        <p class="v n" id="total" style="font-size:clamp(20px,3vw,32px)"></p>
        <p class="small" id="tSub" style="margin-top:10px"></p>
      </div>
    </div>
    <div class="payroad" id="payroad" aria-hidden="true"></div>
    <div style="margin-bottom:48px"></div>
    <div class="groups" id="groups"></div>
    <p class="small" style="margin-top:40px">INSS fora do total (é transferência). O total é um piso. <a href="metodo.html">Método</a> · <a href="metodo.html#pib">E os 3,8% da FNP?</a></p>
  </div></section>
</main>
<div id="footer"></div>
<script src="assets/data-real.js"></script>
<script src="assets/data.js"></script>
<script src="assets/model.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
const F=M.fmt, esc=UI.esc;
const terr=document.getElementById('terr'), inss=document.getElementById('inss');
const alpha=[...M.cidades].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
terr.innerHTML=`<option value="rmc">Região inteira, 20 municípios</option>`+alpha.map(c=>`<option value="${c.slug}">${esc(c.nome)}</option>`).join('');
const INK={sus:'var(--on-sus)',gap:'var(--stripe)',prod:'var(--bg)',veic:'var(--bg)',pub:'var(--bg)',cong:'var(--ink)',prev:'var(--ink)'};
function render(){
  const h=location.hash.replace('#','');
  const t=M.bySlug[h]||M.regiao;
  terr.value=t.slug;
  const c=M.contaCompleta(t,inss.checked), counted=c.grupos.filter(g=>!g.excl), pc=g=>g.tot/c.total*100;
  const nome=t.slug==='rmc'?'20 municípios':t.nome;
  document.getElementById('sLabel').textContent=`Saúde, estimada · ${nome}`;
  document.getElementById('saude').textContent=F.money(t.real);
  document.getElementById('saudeSub').innerHTML=`SUS pagou ${F.money(t.pago)} ${UI.src('pago','SIH/SUS 2025, valor oficial')} · além da tabela ${F.money(t.gap)} ${UI.src('custo','IPEA/ANTP, cenário conservador')}`;
    document.getElementById('total').textContent=F.money(c.total);
  document.getElementById('tSub').textContent=`${F.pl(t.obitos,'morte','mortes')} · ${F.pl(t.internacoes,'internação','internações')} · ${F.dec(c.pibShare*100,2)}% do PIB`;
  document.getElementById('payroad').innerHTML=counted.map(g=>`<i style="flex:${Math.max(pc(g),.01)} 1 0;background:${g.cor};color:${INK[g.id]}">${pc(g)>=9?`<span class="n"${g.id==='gap'?' style="background:var(--sign);padding:2px 8px;border-radius:6px"':''}>${g.lbl} ${Math.round(pc(g))}%</span>`:''}</i>`).join('');
  document.getElementById('groups').innerHTML=c.grupos.map(g=>`<details class="grp${g.excl?' excl':''}">
    <summary><span class="grp-top"><i style="--c:${g.cor}"></i><span>${g.lbl}${g.excl?' · fora do total':''}</span></span><b class="grp-tot n">${F.money(g.tot)}</b></summary>
    <p class="who">${g.who}</p>
    <div>${g.items.map(x=>`<div class="item"><span>${x.lbl}</span><span class="val n">${F.money(x.val)}</span></div>`).join('')}</div></details>`).join('');
}
terr.addEventListener('change',()=>{location.hash=terr.value});
inss.addEventListener('change',render);
addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
